name: Import validated translation drafts
on:
  workflow_dispatch:
    inputs:
      translation_run:
        description: Translation workflow run ID in this repository
        required: true
        type: string
  push:
    branches: [arena/01a0e471-skills-catalog]
    paths: [.github/workflows/import-translations.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: import-persian-translations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.translation_run || '36353925921' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0e471-skills-catalog
      - name: Validate source run and await artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > /tmp/run.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/run.json'))
          assert run['head_branch']=='arena/01a0e471-skills-catalog'
          assert run['path']=='.github/workflows/translate-catalog.yml'
          PY
          gh run watch "$RUN_ID" --exit-status --interval 30 || true
      - uses: actions/download-artifact@v4
        with:
          name: persian-translations
          path: translation-output/
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Validate and import drafts
        run: python3 scripts/import_translations.py translation-output/fa.json
      - name: Save drafts only to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fa.json data/translation-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import Persian translation drafts with source validation'
            git push origin HEAD:arena/01a0e471-skills-catalog
          fi
