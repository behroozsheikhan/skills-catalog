name: Complete Persian translation drafts
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0e471-skills-catalog]
    paths: [.github/workflows/complete-translations.yml]
permissions:
  contents: read
  actions: read
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: persian-translations
          path: translation-output/
          run-id: 36353925921
          github-token: ${{ github.token }}
      - name: Translate remaining fields at a limited request rate
        run: python3 scripts/bulk_translate.py --shard-index ${{ matrix.shard }} --shard-count 4 --delay 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persian-shard-${{ matrix.shard }}
          path: translation-output/
          retention-days: 7
  assemble:
    needs: translate
    if: always()
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0e471-skills-catalog
      - uses: actions/download-artifact@v4
        with:
          pattern: persian-shard-*
          path: shards/
      - name: Combine independently translated fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cache={};failures=[]
          for p in sorted(Path('shards').glob('*/field-cache.json')):
              cache.update(json.loads(p.read_text()))
          for p in sorted(Path('shards').glob('*/failures.json')):
              failures.extend(json.loads(p.read_text()))
          out=Path('translation-output');out.mkdir(exist_ok=True)
          (out/'field-cache.json').write_text(json.dumps(cache,ensure_ascii=False))
          (out/'failures.json').write_text(json.dumps(failures,ensure_ascii=False))
          PY
          python3 scripts/bulk_translate.py --assemble-only
          python3 scripts/import_translations.py translation-output/fa.json
      - name: Publish validated draft data on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fa.json data/translation-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Expand Persian drafts using validated batch translations'
            git push origin HEAD:arena/01a0e471-skills-catalog
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-persian-translations
          path: translation-output/
          retention-days: 7
